<head>

    <title>Week 6 Wednesday & Thursday Practice Quiz</title>
    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e; /* Dark background */
            --container-bg: #3c424f; /* Slightly lighter container */
            --text-color: #e8e6e3; /* Light text */
            --question-text-color: #8ab4f8; /* Light blue for questions */
            --lo-text-color: #b0c4de; /* Lighter blue for learning objective */
            --border-color: #555; /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;
            --feedback-incorrect-border: #a4133c;
            --feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
             transition: background-color 0.3s, color 0.3s;
        }
         #theme-toggle-button:hover {
             opacity: 0.8;
         }


        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }
        
        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
             font-weight: bold;
             color: var(--question-text-color);
        }
        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

         .check-button:disabled {
             background-color: var(--button-disabled-bg);
             cursor: not-allowed;
             opacity: 0.7;
         }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
             font-weight: bold;
             font-size: 1.1em;
             display: block;
             margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }
        
        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }

    </style>
</head>
<body>

    <h1>Week 6 Wednesday & Thursday Practice Quiz</h1>

    <script>
        const quizData = [
    {
        learningObjective: "LO 1.1 (Overview of the Adaptive Immune System): Identify the origin and locations for development for B cells and T cells. (USMLE 1.A., 1.B.8., 1.B.9.)",
        question: "A researcher is studying the earliest stages of lymphocyte differentiation. To isolate the common hematopoietic stem cells that give rise to both B and T lymphocytes, tissue samples should be obtained from which location in a healthy adult?",
        options: { 
            A: "Thymus", 
            B: "Spleen", 
            C: "Bone marrow", 
            D: "Lymph node" 
        },
        correctAnswer: "C",
        rationale: "Both B cells and T cells, the principal cells of the adaptive immune system, originate from pluripotent hematopoietic stem cells. In adults, the primary site of hematopoiesis, and therefore the origin of these stem cells, is the bone marrow.",
        source: "'B cells and T cells arise from stem cells in the bone marrow' (Overview of the Adaptive Immune System, Slide 3)"
    },
    {
        learningObjective: "LO 1.1 (Overview of the Adaptive Immune System): Identify the origin and locations for development for B cells and T cells. (USMLE 1.A., 1.B.8., 1.B.9.)",
        question: "A 6-month-old infant presents with recurrent bacterial infections and is found to have an absence of B cells in the peripheral blood. T cell numbers and function are normal. This specific defect in humoral immunity is most likely due to a problem in the developmental microenvironment of which primary lymphoid organ?",
        options: { 
            A: "Thymus", 
            B: "Bone marrow", 
            C: "Spleen", 
            D: "Peyer's patch" 
        },
        correctAnswer: "B",
        rationale: "In humans, B lymphocytes undergo their entire developmental process, from stem cell to immature B cell, within the bone marrow. A defect in this environment would specifically impact B cell maturation, while leaving T cell development (which occurs in the thymus) intact.",
        source: "'In humans, B cells start and finish their development in the bone marrow' (Overview of the Adaptive Immune System, Slide 3)"
    },
    {
        learningObjective: "LO 1.1 (Overview of the Adaptive Immune System): Identify the origin and locations for development for B cells and T cells. (USMLE 1.A., 1.B.8., 1.B.9.)",
        question: "A newborn infant is diagnosed with complete DiGeorge syndrome, characterized by thymic aplasia. While the precursors for T cells originate normally, they fail to mature. This patient's profound immunodeficiency is a direct result of the absence of the specific organ where T cells complete their development. Which organ is absent?",
        options: { 
            A: "Spleen", 
            B: "Bone marrow", 
            C: "Bursa of Fabricius", 
            D: "Thymus" 
        },
        correctAnswer: "D",
        rationale: "T cell precursors originate in the bone marrow but must migrate to the thymus to undergo maturation and selection. The thymus provides the unique environment necessary for this process. In its absence, T cell development is halted, leading to a severe T cell immunodeficiency.",
        source: "'T cells finish their development in the thymus, hence their name' (Overview of the Adaptive Immune System, Slide 3)"
    },
    {
        learningObjective: "LO 1.2 (Overview of the Adaptive Immune System): Understand B and T cell development and how they make their receptors, giving examples of gene variants that affect B cell and T cell development. (USMLE 1.A., 1.B.8., 1.B.9., 2.A.2.)",
        question: "A 9-month-old boy presents with recurrent otitis media and pneumonia. Flow cytometry shows normal numbers of T cells but an absence of B cells in the peripheral blood. Genetic analysis reveals a mutation in the BTK gene, which encodes a tyrosine kinase essential for signal transduction. This mutation interrupts B cell development at which critical stage?",
        options: { 
            A: "Stem cell to pro-B cell transition", 
            B: "Checkpoint signaling after heavy chain rearrangement", 
            C: "Negative selection of self-reactive B cells", 
            D: "Mature B cell to plasma cell differentiation" 
        },
        correctAnswer: "B",
        rationale: "Bruton tyrosine kinase (BTK) is a critical signaling molecule that functions at a developmental checkpoint for B cells, specifically after the successful rearrangement of the immunoglobulin heavy chain. A non-functional BTK prevents the developing B cell from receiving the necessary survival and proliferation signals, leading to developmental arrest at the pre-B cell stage. This results in X-linked agammaglobulinemia (XLA).",
        source: "'X-linked agammaglobulinemia type 1 (XLA1) occurs when an important signaling molecule, Bruton tyrosine kinase (BTK), in the checkpoint process is non-functional' (Overview of the Adaptive Immune System, Slide 13)"
    },
    {
        learningObjective: "LO 1.2 (Overview of the Adaptive Immune System): Understand B and T cell development and how they make their receptors, giving examples of gene variants that affect B cell and T cell development. (USMLE 1.A., 1.B.8., 1.B.9., 2.A.2.)",
        question: "A newborn screening test reveals an abnormally low count of T-cell receptor excision circles (TRECs). This finding is highly suggestive of a profound defect in the development of T cells. This defect is most likely due to an impairment in which fundamental molecular process?",
        options: { 
            A: "Class switching of immunoglobulin heavy chains", 
            B: "Generation of antibody diversity by somatic hypermutation", 
            C: "Gene rearrangement to form the T cell receptor", 
            D: "Expression of MHC class II molecules on thymic epithelium" 
        },
        correctAnswer: "C",
        rationale: "T-cell receptor excision circles (TRECs) are circular DNA fragments that are excised and discarded during the process of V(D)J recombination, which assembles the T cell receptor genes. A low TREC count indicates that this gene rearrangement process is not occurring normally, leading to a failure of T cell production. This is the basis for using TREC analysis to screen for Severe Combined Immunodeficiency (SCID).",
        source: "'A low TREC count indicates some problem with T cell development, with one serious cause being severe combined immunodeficiency (SCID)' (B Cell and T Cell Receptors, and their Antigens, Slide 30)"
    },
    {
        learningObjective: "LO 1.2 (Overview of the Adaptive Immune System): Understand B and T cell development and how they make their receptors, giving examples of gene variants that affect B cell and T cell development. (USMLE 1.A., 1.B.8., 1.B.9., 2.A.2.)",
        question: "A patient with a form of severe combined immunodeficiency (SCID) is found to have a complete absence of both B and T cells, but normal NK cell numbers. A genetic defect in the RAG-1 or RAG-2 enzymes is suspected. The function of these enzymes is essential for which of the following processes?",
        options: { 
            A: "Nucleotide metabolism", 
            B: "Cytokine signaling via the JAK-STAT pathway", 
            C: "Actin polymerization in the cytoskeleton", 
            D: "V(D)J recombination of lymphocyte receptor genes" 
        },
        correctAnswer: "D",
        rationale: "The RAG-1 and RAG-2 proteins form a complex that is the critical enzyme for initiating V(D)J recombination, the process of cutting and pasting gene segments to create functional B cell and T cell receptors. A complete deficiency of RAG activity prevents the development of both B and T cells, resulting in SCID. NK cells do not undergo this process and are therefore unaffected.",
        source: "'The process is overseen by the RAG-1 and RAG-2 complexes... A gene variant in either of these can cause loss of function, causing one form of severe combined immunodeficiency (SCID)' (B Cell and T Cell Receptors, and their Antigens, Slides 28 & 31)"
    },
    {
        learningObjective: "LO 5.1 (B Cell & T Cell Receptors): Describe the overall structure of B cell receptors (antibody) and T cell receptors and define immunoglobulin class and subclass. (USMLE 1.B.9.)",
        question: "An antibody molecule is composed of two identical heavy chains and two identical light chains. The class of the antibody (e.g., IgG, IgM, IgA) is determined by the structure of which component?",
        options: { 
            A: "The variable region of the light chain (VL)", 
            B: "The variable region of the heavy chain (VH)", 
            C: "The constant region of the light chain (CL)", 
            D: "The constant region of the heavy chain (CH)" 
        },
        correctAnswer: "D",
        rationale: "The class, or isotype, of an antibody is defined by the amino acid sequence of the constant region of its heavy chain. There are five main types of heavy chains (mu, delta, gamma, epsilon, alpha) which correspond to the five main antibody classes (IgM, IgD, IgG, IgE, IgA).",
        source: "'Antibody class (or subclass) is determined by the nature of the heavy chain' (B Cell and T Cell Receptors, and their Antigens, Slide 13)"
    },
    {
        learningObjective: "LO 5.1 (B Cell & T Cell Receptors): Describe the overall structure of B cell receptors (antibody) and T cell receptors and define immunoglobulin class and subclass. (USMLE 1.B.9.)",
        question: "A researcher is studying the structure of an IgA antibody molecule. She notes that in addition to IgG, this is one of only two immunoglobulin classes that has subclasses in humans. How many subclasses of IgA exist?",
        options: { 
            A: "One", 
            B: "Two", 
            C: "Three", 
            D: "Four" 
        },
        correctAnswer: "B",
        rationale: "In humans, only IgG and IgA have subclasses. IgG has four subclasses (IgG1, IgG2, IgG3, IgG4), and IgA has two subclasses (IgA1 and IgA2). These subclasses have minor structural differences and distinct functional properties.",
        source: "'IgG and IgA have subclasses: IgG1, IgG2, IgG3, IgG4; IgA1, IgA2' (B Cell and T Cell Receptors, and their Antigens, Slide 4)"
    },
    {
        learningObjective: "LO 5.1 (B Cell & T Cell Receptors): Describe the overall structure of B cell receptors (antibody) and T cell receptors and define immunoglobulin class and subclass. (USMLE 1.B.9.)",

        options: { 
            A: "Constant domains", 
            B: "Hinge regions", 
            C: "Complementarity-determining regions (CDRs)", 
            D: "Fc regions" 
        },
        correctAnswer: "C",
        rationale: "The variable regions of both the heavy and light chains contain three specific loops of hypervariable amino acid sequence. These loops are called complementarity-determining regions (CDRs) or hypervariable regions. They form the three-dimensional surface that is complementary to the shape of the antigen's epitope, thus determining the antibody's binding specificity.",
        source: "'The very tip of the variable chains is very highly variable; these areas are called “hypervariable regions” or “complementarity-determining regions” (CDRs)' (B Cell and T Cell Receptors, and their Antigens, Slide 14)"
    },
    {
        learningObjective: "LO 5.2 (B Cell & T Cell Receptors): Describe the consequences of papain and pepsin digestion of antibody molecules. (USMLE 1.B.9.)",
        question: "A researcher digests a sample of purified IgG with the enzyme papain. This enzyme cleaves the antibody molecule above the hinge region. Which of the following sets of fragments will be generated?",
        options: { 
            A: "One F(ab')2 fragment and multiple small peptides", 
            B: "Two separate Fab fragments and one Fc fragment", 
            C: "One intact IgG molecule", 
            D: "Two heavy chains and two light chains" 
        },
        correctAnswer: "B",
        rationale: "Papain cleaves the IgG molecule at the hinge region, separating the two antigen-binding arms from the constant tail portion. This results in the generation of three fragments: two identical Fab (fragment, antigen-binding) fragments, each consisting of a light chain and the VH and CH1 domains of a heavy chain, and one Fc (fragment, crystallizable) fragment, consisting of the remaining heavy chain constant domains.",
        source: "'Papain: 2 Fab, 1 Fc' (B Cell and T Cell Receptors, and their Antigens, Slide 9)"
    },
    {
        learningObjective: "LO 5.2 (B Cell & T Cell Receptors): Describe the consequences of papain and pepsin digestion of antibody molecules. (USMLE 1.B.9.)",
        question: "An immunologist wants to create an antibody fragment that can still bind to and cross-link antigens but lacks the effector functions associated with the Fc region, such as complement activation. To achieve this, she should digest an IgG molecule with which enzyme?",
        options: { 
            A: "Trypsin", 
            B: "Papain",

        source: "'Pepsin: 1 F(ab')2, lots of little pieces' (B Cell and T Cell Receptors, and their Antigens, Slide 9)"
    },
    {
        learningObjective: "LO 5.2 (B Cell & T Cell Receptors): Describe the consequences of papain and pepsin digestion of antibody molecules. (USMLE 1.B.9.)",
        question: "The fragment of an antibody that interacts with receptors on phagocytes and NK cells, and which also activates the classical complement pathway, is known by what name?",
        options: { 
            A: "Fab fragment", 
            B: "F(ab')2 fragment", 
            C: "Fc fragment", 
            D: "Variable region" 
        },
        correctAnswer: "C",
        rationale: "The Fc (fragment, crystallizable) region is the 'tail' of the antibody, composed of the constant domains of the heavy chains (CH2, CH3, and sometimes CH4). This region mediates the effector functions of the antibody by binding to Fc receptors on various immune cells and by binding to C1q to initiate the classical complement cascade.",
        source: "'“Fab” and “Fc” nomenclature used extensively' (B Cell and T Cell Receptors, and their Antigens, Slide 9). The diagram on slide 5 shows 'Fc receptor/ complement-binding sites' located on the Fc region."
    },
    {
        learningObjective: "LO 5.3 (B Cell & T Cell Receptors): Briefly describe how monoclonal antibodies are made and named... deduce how much mouse protein is present. (USMLE 1.B.9., 1.E.2.)",
        question: "A patient with Crohn's disease is treated with infliximab. Based on the standard nomenclature for therapeutic monoclonal antibodies, what can be inferred about the origin of this drug?",
        options: { 
            A: "It is a fully human antibody.", 
            B: "It is a fully mouse antibody.", 
            C: "It is a humanized antibody containing less than 5% mouse protein.", 
            D: "It is a chimeric antibody containing more than 5% mouse protein." 
        },
        correctAnswer: "D",
        rationale: "The suffix '-ximab' in a monoclonal antibody's generic name denotes that it is a chimeric antibody. Chimeric antibodies are constructed by fusing the variable regions of a mouse antibody (which provide antigen specificity) with the constant regions of a human antibody. This means they contain a significant amount of mouse protein (>5%).",
        source: "'-ximab = chimeric monoclonal antibody (contains >5% mouse protein)' (B Cell and T Cell Receptors, and their Antigens, Slide 19)"
    },
    {
        learningObjective: "LO 5.3 (B Cell & T Cell Receptors): Briefly describe how monoclonal antibodies are made and named... deduce how much mouse protein is present. (USMLE 1.B.9., 1.E.2.)",
        question: "A patient with severe asthma is prescribed omalizumab. This therapeutic antibody is designed to be minimally immunogenic in humans. The '-umab' suffix indicates that it is composed of what?",
        options: { 
            A: "100% mouse protein", 
            B: "100% human protein", 
            C: "Primarily human protein with mouse CDRs", 
            D: "Primarily mouse protein with human constant regions" 
        },
        correctAnswer: "B",
        rationale: "The suffix '-umab' signifies that the monoclonal antibody is fully human. These antibodies are typically produced using transgenic mice engineered to have human immunoglobulin genes or through phage display technologies. They contain no mouse protein and are therefore the least likely to provoke an immune response in the patient.",
        source: "'-umab = 100% human monoclonal antibody (contains no mouse protein)' (B Cell and T Cell Receptors, and their Antigens, Slide 19)"
    },
    {
        learningObjective: "LO 5.3 (B Cell & T Cell Receptors): Briefly describe how monoclonal antibodies are made and named... deduce how much mouse protein is present. (USMLE 1.B.9., 1.E.2.)",
        question: "Trastuzumab is a monoclonal antibody used to treat HER2-positive breast cancer. Its generic name ends in '-zumab'. This suffix indicates that the antibody has been engineered in a specific way to reduce immunogenicity. What does '-zumab' signify?",
        options: { 
            A: "It is a fully mouse antibody.", 
            B: "It is a chimeric antibody where the entire mouse variable region is fused to a human constant region.", 
            C: "It is a humanized antibody where only the antigen-binding loops (CDRs) from a mouse antibody have been grafted onto a human antibody framework.", 
            D: "It is a fully human antibody derived from transgenic mice." 
        },
        correctAnswer: "C",
        rationale: "The suffix '-zumab' indicates a humanized monoclonal antibody. This is a more advanced engineering technique than creating a chimeric antibody. In a humanized antibody, only the small hypervariable regions (CDRs) that directly contact the antigen are of mouse origin. These are grafted onto the variable region framework of a human antibody, which is then attached to a human constant region. This results in an antibody with very low mouse protein content (<5%).",
        source: "'-zumab = humanized monoclonal antibody (contains <5% mouse protein)' (B Cell and T Cell Receptors, and their Antigens, Slide 19)"
    },
    {

        options: {

            B: "Kappa and lambda chains", 
            C: "Alpha (α) and beta (β) chains", 
            D: "Gamma (γ) and delta (δ) chains" 
        },
        correctAnswer: "C",
        rationale: "The vast majority of T cells express a TCR made of an alpha (α) chain and a beta (β) chain. The α chain is structurally similar to an antibody light chain, and the β chain is similar to an antibody heavy chain. A smaller population of T cells uses gamma (γ) and delta (δ) chains instead.",
        source: "'Instead of being called heavy and light chains, they’re called alpha (α) and beta (β) chains. These T cells are called alpha-beta (αβ) T cells.' (B Cell and T Cell Receptors, and their Antigens, Slide 22)"
    },
    {
        learningObjective: "LO 5.4 (B Cell & T Cell Receptors): Describe the overall structure of T cell receptors. (USMLE 1.B.8.)",
        question: "Like a B cell receptor, a T cell receptor has distinct variable (V) and constant (C) regions. How many V and C regions does a single T cell receptor alpha (α) chain possess?",
        options: { 
            A: "One V and one C region",

        },
        correctAnswer: "A",
        rationale: "Both the alpha and beta chains of the TCR are simpler in structure than an antibody heavy chain. Each TCR chain consists of a single variable (V) domain at the N-terminus, which contributes to antigen binding, and a single constant (C) domain adjacent to the cell membrane.",
        source: "'Each chain has a single V (variable) region (where antigen binding occurs), and a single C (constant) region' (B Cell and T Cell Receptors, and their Antigens, Slide 23)"
    },
    {
        learningObjective: "LO 5.4 (B Cell & T Cell Receptors): Describe the overall structure of T cell receptors. (USMLE 1.B.8.)",
        question: "The T cell receptor beta (β) chain is structurally analogous to which component of a B cell receptor?",
        options: { 
            A: "The light chain", 
            B: "The heavy chain", 
            C: "The J chain",

        const quizContainer = document.getElementById('quiz-container');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const bodyElement = document.body;

        function applyTheme(theme) {
            if (theme === 'light') {
                bodyElement.classList.add('light-theme');
                themeToggleButton.textContent = 'Switch to Dark Mode';
            } else {
                bodyElement.classList.remove('light-theme');
                themeToggleButton.textContent = 'Switch to Light Mode';
            }
            localStorage.setItem('quizTheme', theme);
        }

        function loadQuiz() {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.id = `q${index}`;

                const loText = document.createElement('div');
                loText.classList.add('learning-objective');
                loText.textContent = qData.learningObjective;
                questionBlock.appendChild(loText);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');

                for (const optionKey in qData.options) {
                    const optionId = `q${index}_${optionKey}`;
                    const label = document.createElement('label');
                    label.htmlFor = optionId;
                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `q${index}`;
                    radioInput.value = optionKey;
                    radioInput.id = optionId;
                    const labelText = document.createElement('span');
                    labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;
                    label.appendChild(radioInput);
                    label.appendChild(labelText);
                    optionsDiv.appendChild(label);
                }
                questionBlock.appendChild(optionsDiv);

                const buttonContainer = document.createElement('div');
                buttonContainer.classList.add('button-container');

                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check Answer';
                checkButton.classList.add('check-button');
                checkButton.onclick = () => checkAnswer(index);
                buttonContainer.appendChild(checkButton);
                
                questionBlock.appendChild(buttonContainer);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                quizContainer.appendChild(questionBlock);
            });
        }

        function checkAnswer(questionIndex) {
            const questionBlockElement = document.getElementById(`q${questionIndex}`);
            const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');

            if (!selectedRadioButton) {
                alert("Please select an answer first.");
                return;
            }

            const selectedOptionKey = selectedRadioButton.value;
            const qData = quizData[questionIndex];
            const feedbackDiv = questionBlockElement.querySelector('.feedback');
            const correct = selectedOptionKey === qData.correctAnswer;

            let feedbackHTML = '';

            if (correct) {
                feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                feedbackDiv.className = 'feedback correct';
            } else {
                 feedbackHTML = `<span class="feedback-status">Incorrect.</span> The correct answer is ${qData.correctAnswer}.`;
                feedbackDiv.className = 'feedback incorrect';
            }

            feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
            feedbackHTML += `<div class="feedback-source">${qData.source}</div>`;
            feedbackDiv.innerHTML = feedbackHTML;
        }

        themeToggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-theme')) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });

    </script>
